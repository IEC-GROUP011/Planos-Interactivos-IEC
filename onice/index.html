<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visor de planos Ónice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Visor de planos de la instalación solar de la calle Ónice: del plano general a cada edificio y a cada cubierta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con migas de pan, escenario con el plano a la izquierda, lista de zonas a la derecha */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#14202B; --muted:#586878; --line:#D2D8DE;
  --stage:#D8DDE3; --accent:#0F5789; --accent-ink:#FFFFFF; --hot:rgba(15,87,137,.10);
  --t1:#2776BB; --t2:#129C47; --t3:#E5242A; --t4:#E4C400;
  --on-t1:#FFFFFF; --on-t2:#FFFFFF; --on-t3:#FFFFFF; --on-t4:#2B2500;
  --ok:#1E8A4C; --on-ok:#FFFFFF;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,32,43,.08),0 6px 20px rgba(20,32,43,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ok:#4CC38A; --on-ok:#06210F;
  --bg:#0E141A; --surface:#161F27; --ink:#E6EDF3; --muted:#92A3B3; --line:#26323D;
  --stage:#0A0F13; --accent:#63B4EA; --accent-ink:#06202F; --hot:rgba(99,180,234,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --ok:#4CC38A; --on-ok:#06210F;
  --bg:#0E141A; --surface:#161F27; --ink:#E6EDF3; --muted:#92A3B3; --line:#26323D;
  --stage:#0A0F13; --accent:#63B4EA; --accent-ink:#06202F; --hot:rgba(99,180,234,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{height:100dvh;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;min-height:52px;padding-top:6px;flex:none}
.back{flex:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.back:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.back:disabled{opacity:.35;cursor:default}
.back svg{width:18px;height:18px}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.crumbs li{display:flex;align-items:center;gap:6px;min-width:0}
.crumbs li+li::before{content:"";width:6px;height:6px;border-top:1.5px solid var(--muted);border-right:1.5px solid var(--muted);transform:rotate(45deg);margin-right:4px;opacity:.7}
.crumbs button{background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap}
.crumbs button:hover{color:var(--accent);background:var(--hot)}
.crumbs [aria-current="page"]{color:var(--ink);font-weight:600;padding:4px 6px;white-space:nowrap}
.site{flex:none;font:500 12px/1.2 var(--mono);color:var(--muted);text-align:right;letter-spacing:.02em}
.site b{display:block;color:var(--ink);font-weight:600}

.app{flex:1;min-height:0;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.stage{position:relative;min-width:0;min-height:0;background:var(--stage);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.28)}
.sheet img{display:block;width:100%;height:100%;pointer-events:none}
.sheet svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.inert{pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:500 13px var(--mono)}

.zone{cursor:pointer;outline:none}
.zone polygon{fill:var(--zc);fill-opacity:.12;stroke:var(--zc);stroke-opacity:.9;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill-opacity .15s,stroke-width .15s}
.zone.hot polygon,.zone:hover polygon{fill-opacity:.38;stroke-width:3}
.zone:focus-visible polygon{stroke:var(--accent);stroke-width:4;fill-opacity:.38}
.zone .tag{transform:translate(var(--lx),var(--ly)) scale(var(--inv,1));pointer-events:none}
.zone .tag rect{fill:var(--zc);stroke:rgba(255,255,255,.9);stroke-width:1.5;vector-effect:non-scaling-stroke}
.zone .tag text{fill:var(--zt);font:600 12px var(--mono);text-anchor:middle;dominant-baseline:central}
.lvl0 .zone polygon{fill-opacity:.06;stroke-opacity:0}
.lvl0 .zone.hot polygon,.lvl0 .zone:hover polygon{fill-opacity:.34;stroke-opacity:1}

.hint{display:none;position:absolute;left:12px;bottom:12px;max-width:calc(100% - 150px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--muted);box-shadow:var(--shadow);pointer-events:none}
.ctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.ctl button:hover{border-color:var(--accent);color:var(--accent)}
.ctl svg{width:18px;height:18px}

.side{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.side header{padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:none}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.side h2{margin:6px 0 2px;font-size:19px;line-height:1.2;font-weight:600;text-wrap:balance}
.side header p{margin:0;color:var(--muted);font-size:13px}
.list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0}
.item{width:100%;display:grid;grid-template-columns:6px auto minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:none;cursor:pointer}
.item:hover,.item.hot{background:var(--hot)}
.item[aria-current="true"]{background:var(--hot);box-shadow:inset 0 0 0 1.5px var(--accent)}
.item .sw{align-self:stretch;border-radius:3px;background:var(--zc)}
.item .id{font:600 13px var(--mono)}
.item .meta{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex:none}
.pager button{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:500 13px var(--mono)}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button:disabled{opacity:.35;cursor:default}
.item:focus-visible,.back:focus-visible,.crumbs button:focus-visible,.ctl button:focus-visible,.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.pbtn{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.pbtn:hover{border-color:var(--accent);color:var(--accent)}
.pbtn svg{width:18px;height:18px}
.app.nopanel{grid-template-columns:minmax(0,1fr)}
.app.nopanel .side{display:none}
.fsnav{display:none;position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:5;flex-direction:column;align-items:flex-end;gap:5px;max-width:min(250px,calc(100% - 16px))}
.stage:fullscreen .fsnav,.stage.pfs .fsnav{display:flex}
.fsbar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow);max-width:100%}
.fsbar button{height:28px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 8px}
.fsbar button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.fsbar button:disabled{opacity:.35;cursor:default}
.fsbar svg{width:13px;height:13px;flex:none;transition:transform .15s}
.fsbar #fsback{width:28px;justify-content:center;padding:0}
.fsbar #fstog{background:var(--hot);font:600 11.5px var(--mono);color:var(--accent);min-width:0}
.fsbar #fstog span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsnav.open #fstog svg{transform:rotate(180deg)}
.fsmenu{display:none;width:min(240px,100%);max-height:calc(100dvh - 60px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--shadow)}
.fsnav.open .fsmenu{display:block}
.fsmenu h3{margin:5px 6px 2px;font:600 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fsmenu button{width:100%;display:grid;grid-template-columns:4px 1fr auto;align-items:center;gap:8px;padding:5px 7px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:left;font:600 11.5px var(--mono)}
.fsmenu button:hover{background:var(--hot)}
.fsmenu button[aria-current="true"]{background:var(--hot);outline:1px solid var(--accent)}
.fsmenu button i{width:4px;height:14px;border-radius:3px;background:var(--zc,transparent)}
.fsmenu button small{font:400 10px var(--mono);color:var(--muted)}
.stage.pfs{position:fixed;inset:0;z-index:50;border-radius:0;border:0}
.stage:fullscreen{border-radius:0;border:0}
/* Panel de checks (izquierda): avance de obra y checklist del nivel más concreto */
.tools{flex:none;display:flex;gap:8px;margin-left:auto}
.checks{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.app.nochecks .checks{display:none}
.checks[hidden]{display:none}
.chead{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px 12px;flex:none;cursor:default;color:inherit}
.chead .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.chead h2{margin:6px 0 2px;font-size:19px;line-height:1.2;font-weight:600;text-wrap:balance}
.chead .cnt{font:600 13px var(--mono);color:var(--ok);white-space:nowrap}
.chead p{margin:0;color:var(--muted);font-size:13px}
.chead .chev{display:none;width:18px;height:18px;flex:none;transition:transform .15s}
.cbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.cbar i{display:block;height:100%;width:0;background:var(--ok);border-radius:4px;transition:width .25s}
.cl{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0}
.chk{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);align-items:center;gap:12px;text-align:left;min-height:48px;padding:9px 10px;border:0;border-radius:8px;background:none;color:inherit}
button.chk{cursor:pointer}
button.chk:hover{background:var(--hot)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent}
.box svg{width:15px;height:15px}
.chk[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.chk .lbl{font-weight:500;line-height:1.25}
.chk .who{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.ag{padding:9px 10px}
.ag .row{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.ag .row b{font:600 12.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ag .cbar{margin-top:6px;height:5px}
.cnote{flex:none;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.chk:focus-visible,.chead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zone .tag .pgbg{fill:rgba(255,255,255,.9);stroke:var(--zc);stroke-width:1;vector-effect:non-scaling-stroke}
.zone .tag .pgf{fill:var(--ok)}
@media (max-width:820px){
  body{gap:6px}
  .tools{gap:6px}
  .pbtn{width:40px;height:40px;padding:0;justify-content:center}
  .pbtn span{display:none}
  .top{min-height:44px;padding-top:4px}
  .app{display:flex!important;flex-direction:column;gap:8px}
  .stage{order:1;flex:1 1 0;min-height:0}
  .checks{order:2;flex:none;max-height:46dvh}
  .side{order:3;flex:none}
  .chead{cursor:pointer;padding:9px 12px}
  .chead .eyebrow,.chead p{display:none}
  .chead h2{margin:0;font-size:15px}
  .chead .chev{display:block}
  .checks.open .chev{transform:rotate(180deg)}
  .chead .cbar{margin-top:7px}
  .crumbs{flex-wrap:nowrap;overflow:hidden}
  .crumbs li:nth-last-child(n+3){display:none}
  .crumbs li{min-width:0}
  .crumbs button,.crumbs [aria-current="page"]{overflow:hidden;text-overflow:ellipsis}
  .checks:not(.open) .cl,.checks:not(.open) .cnote{display:none}
  .stage{border-radius:8px}
  .site{display:none}
  .side{max-height:none}
  .side header{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;padding:8px 12px 2px;border-bottom:0}
  .eyebrow{display:none}
  .side h2{margin:0;font-size:15px}
  .side header p{font-size:12px}
  .list{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 10px 10px;flex:none;-webkit-overflow-scrolling:touch}
  .list li{flex:none}
  .item{width:auto;min-width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;grid-template-columns:5px auto auto;gap:8px}
  .item .meta{display:none}
  .item .n{font-size:11.5px}
  .pager{border-top:0;padding:0 10px 10px}
  .hint{left:8px;bottom:8px;right:60px;max-width:none;font-size:12px;padding:6px 9px}
  .ctl{right:8px;bottom:8px}
  .ctl button{width:40px;height:40px}
  .back{width:40px;height:40px}
}
/* Móvil en horizontal (pantalla baja): checks fijos a la izquierda, plano ancho y navegación de zonas dentro del plano */
@media (orientation:landscape) and (max-height:520px){
  body{gap:4px}
  .top{min-height:48px;padding-top:2px;gap:8px}
  .site{display:none}
  .back,.pbtn{width:44px;height:44px}
  .pbtn{padding:0;justify-content:center}
  .pbtn span{display:none}
  #ptog{display:none}
  .crumbs{flex-wrap:nowrap;overflow:hidden}
  .crumbs li:nth-last-child(n+3){display:none}
  .crumbs button,.crumbs [aria-current="page"]{overflow:hidden;text-overflow:ellipsis}
  .app{display:grid!important;grid-template-rows:minmax(0,1fr);gap:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
  .stage,.checks,.side{order:0}
  .side{display:none!important}
  .checks{max-height:none}
  .chead{cursor:default;padding:8px 12px}
  .chead .eyebrow,.chead p,.chead .chev{display:none}
  .chead h2{margin:0;font-size:16px}
  .chead .cbar{margin-top:6px}
  .checks:not(.open) .cl{display:block}
  .cl{padding:2px 6px}
  .chk{min-height:38px;padding:3px 8px;gap:10px}
  .checks.edit .chk{min-height:44px}
  .chk .who{display:inline;margin-left:8px;font-size:11px}
  .cnote{padding:6px 10px;font-size:11px}
  .cnote:not(.warn){display:none}
  .checks:not(.open) .cnote.warn{display:block}
  .fsnav{display:flex;max-width:min(340px,calc(100% - 16px))}
  .fsbar button{height:44px}
  .fsbar #fsback{width:44px}
  .fsbar #fstog{font-size:13px;padding:0 12px}
  .fsmenu button{padding:10px 8px;font-size:13px}
  .ctl button{width:44px;height:44px}
}
/* Plano en pantalla completa: los checks pasan a un cajón sobre el plano, a la izquierda */
.cpill{display:none;position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:max(8px,env(safe-area-inset-top,0px));z-index:5;height:44px;align-items:center;gap:8px;padding:0 14px 0 10px;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:600}
.cpill svg{width:20px;height:20px;color:var(--accent)}
.cpill b{font:600 13px var(--mono);color:var(--ok)}
.stage:fullscreen .cpill,.stage.pfs .cpill{display:flex}
.stage.cdrawer .cpill,.cpill[hidden]{display:none!important}
.cclose{display:none}
.checks.ovl{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:max(8px,env(safe-area-inset-top,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));width:min(280px,calc(100% - 80px));z-index:6;box-shadow:var(--shadow);max-height:none;order:0;touch-action:pan-y;cursor:default}
.checks.ovl:not(.show){display:none}
.checks.ovl .cl,.checks.ovl .cnote{display:block}
.checks.ovl .chead{cursor:default;padding-right:52px}
.checks.ovl .chead .chev{display:none}
.checks.ovl .cclose{display:grid;place-items:center;position:absolute;top:2px;right:2px;width:44px;height:44px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--muted)}
.checks.ovl .cclose svg{width:20px;height:20px}
.cpill:focus-visible,.cclose:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.zone polygon{transition:none}}
</style></head><body>
<header class="top">
  <button class="back" id="back" aria-label="Volver al plano anterior" title="Volver (Esc)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <ol class="crumbs" id="crumbs" aria-label="Ruta de planos"></ol>
  <div class="tools">
    <button class="pbtn" id="ctog" aria-pressed="false" title="Ocultar checks" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg><span id="ctxt">Ocultar checks</span></button>
    <button class="pbtn" id="ptog" aria-pressed="false" title="Ocultar panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span id="ptxt">Ocultar panel</span></button>
  </div>
  <div class="site"><b>Calle Ónice</b>Málaga · Autoconsumo FV</div>
</header>
<main class="app">
  <aside class="checks" id="checks" aria-label="Checks de avance de obra" hidden></aside>
  <section class="stage" id="stage" aria-label="Visor de planos">
    <div class="loading" id="loading"><div style="text-align:center;padding:0 24px;line-height:1.6">Cargando planos…<br><small style="font:400 12px var(--sans)">Si no avanza, abre el archivo con el navegador (Chrome, Safari o Edge), no desde la vista previa del chat o del correo.</small></div></div>
    <div class="hint" id="hint"></div>
    <div class="fsnav" id="fsnav">
      <div class="fsbar">
        <button id="fsback" aria-label="Subir un nivel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="fstog" aria-expanded="false" aria-controls="fsmenu"><span id="fstxt"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
      </div>
      <div class="fsmenu" id="fsmenu"></div>
    </div>

      crumbs=document.getElementById('crumbs'), backBtn=document.getElementById('back'),
      hint=document.getElementById('hint'), loading=document.getElementById('loading');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const B=Object.fromEntries(DATA.buildings.map(b=>[b.id,b]));
const T=DATA.tipos;

/* ---------- configuración por tipo de instalación ---------- */
const CFG=DATA.cfg||{};
const KIND=CFG.kind||'fotovoltaica';               // 'fotovoltaica' | 'electrica'
const LB=Object.assign(KIND==='electrica'
  ?{l0:'Plano general',l1:'Planta',l1p:'Plantas',l2:'Estancia',l2p:'Estancias',a1:'una planta',a2:'una estancia',unit:'',intro0:'Cada color es una planta.'}
  :{l0:'Implantación',l1:'Edificio',l1p:'Edificios',l2:'Cubierta',l2p:'Cubiertas',a1:'un edificio',a2:'una cubierta',unit:'paneles',intro0:'Cada color es un tipo de edificio.'},CFG.labels||{});
// cruce de planos de detalle por tipo (solo proyectos antiguos sin cfg: los PDF de Ónice venían cruzados)
const DT=CFG.dt||(DATA.cfg?{}:{1:2,2:1,3:3,4:4});
const dt=t=>DT[t]!==undefined?DT[t]:t;
const IV=CFG.imgV?`?v=${CFG.imgV}`:'';   // versión de las imágenes (evita planos viejos en caché)
const CL=Array.isArray(CFG.checklist)?CFG.checklist:[];   // checklist del nivel más concreto (ver checklists.json)
const DEMO=CFG.modo==='demo';                               // demo: se puede marcar y se guarda solo en este navegador
/* escritura: solo dentro de la App IEC. La App inyecta window.IEC_AUTH={token,iniciales} antes de cargar la página;
   sin token el visor es de solo lectura. El visor nunca lleva claves de Airtable: envía los cambios a cfg.writeUrl con ese token. */
const WRITE=CFG.modo==='escritura'&&!!CFG.writeUrl;
const AUTH=()=>(window.IEC_AUTH&&(window.IEC_AUTH.token||window.IEC_AUTH.getToken))?window.IEC_AUTH:null;
/* token vigente: si la App ofrece getToken() (recomendado: el token de Firebase caduca cada hora) se pide en cada envío */
async function tok(){ const A=AUTH(); if(!A) return null; try{ return A.getToken?await A.getToken():A.token; }catch(e){ return null; } }
const CAN=()=>DEMO||(WRITE&&!!AUTH());
const colOf=b=>B[b].col||B[b].tipo;
const tipoTxt=t=>KIND==='electrica'?'':`Tipo ${t}`;
const cubsOf=b=>T[B[b].tipo].cubs;
const cn=c=>(c.n!=null&&LB.unit)?`${c.n} ${LB.unit}`:'';
const join=(...a)=>a.filter(Boolean).join(' · ');
const detailUrl=(t,c)=>(c.img||`img/t${dt(t)}_${c.id.split('.')[1]}.webp`)+IV;
let vw=0, vh=0, cur=null, busy=false, view=null;

/* ---------- avance de obra (lo escribe la App IEC en Airtable; el visor solo lo lee) ---------- */
let PROG={zones:{},updated:null,error:false};
const PKEY=(b,c)=>b+'/'+c;
const zst=(b,c)=>PROG.zones[PKEY(b,c)]||{};
const isDone=(b,c,k)=>{const s=zst(b,c)[k]; return !!(s&&s.done);};
const zdone=(b,c)=>CL.reduce((n,k)=>n+(isDone(b,c,k.id)?1:0),0);
const pctZ=(b,c)=>CL.length?Math.round(100*zdone(b,c)/CL.length):0;
const bZones=b=>cubsOf(b).map(c=>[b,c.id]);
const allZones=()=>DATA.buildings.flatMap(b=>bZones(b.id));
function agg(list){
  const per=CL.map(k=>({k,d:0})); let done=0;
  for(const [b,c] of list) per.forEach(p=>{ if(isDone(b,c,p.k.id)){p.d++;done++;} });
  const max=list.length*CL.length;
  return {n:list.length,per,done,max,pct:max?Math.round(100*done/max):0};
}
const LSKEY='iec-avance:'+(CFG.obraId||location.pathname);
function mergeLocal(){ try{ const j=JSON.parse(localStorage.getItem(LSKEY)||'null'); if(!j||!j.zones) return;
  for(const [z,cs] of Object.entries(j.zones)) PROG.zones[z]=Object.assign({},PROG.zones[z],cs);
  if(j.updated&&(!PROG.updated||j.updated>PROG.updated)) PROG.updated=j.updated; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LSKEY,JSON.stringify({zones:PROG.zones,updated:PROG.updated})); }catch(e){} }
async function loadProgress(){
  if(!CL.length) return;
  if(CFG.progressUrl){
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),5000);
    try{
      const t=WRITE?await tok():null;                   // dentro de la App se lee con el token; fuera, lectura pública
      const r=await fetch(CFG.progressUrl+(CFG.progressUrl.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:ctl.signal,headers:t?{Authorization:'Bearer '+t}:{}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json(); if(!j||typeof j.zones!=='object') throw new Error('formato');
      PROG={zones:j.zones,updated:j.updated||null,error:false};
    }catch(e){ PROG.error=true; console.warn('No se pudo leer el avance',e); }
    finally{ clearTimeout(to); }
  }
  applyQueue(); if(DEMO) mergeLocal();
}
/* cola de cambios sin enviar (modo escritura): se guarda en el móvil y se reintenta hasta que el servidor la acepta */
const QKEY='iec-cola:'+(CFG.obraId||location.pathname);
let QUEUE=[]; try{ QUEUE=JSON.parse(localStorage.getItem(QKEY)||'[]'); if(!Array.isArray(QUEUE)) QUEUE=[]; }catch(e){ QUEUE=[]; }
let AUTHFAIL=false, flushing=false;
const saveQ=()=>{ try{ localStorage.setItem(QKEY,JSON.stringify(QUEUE)); }catch(e){} };
const isPend=(b,c,k)=>QUEUE.some(q=>q.zona===PKEY(b,c)&&q.check===k);
function applyQueue(){ for(const q of QUEUE){ const z=PROG.zones[q.zona]||(PROG.zones[q.zona]={});
  z[q.check]=q.done?{done:true,by:(AUTH()&&AUTH().iniciales)||'',date:(q.ts||'').slice(0,10)}:{done:false}; } }
async function flushQ(){
  if(!WRITE||flushing||!QUEUE.length||!AUTH()) return; flushing=true;
  try{
    while(QUEUE.length){
      const t=await tok(); if(!t){ AUTHFAIL=true; break; }
      const r=await fetch(CFG.writeUrl,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+t},body:JSON.stringify(QUEUE[0])});
      if(r.status===401||r.status===403){ AUTHFAIL=true; break; }
      if(r.status>=500||r.status===429) break;          // fallo temporal: se reintenta más tarde
      AUTHFAIL=false; QUEUE.shift(); saveQ();            // aceptado (o rechazado por datos inválidos: no se reintenta)
    }
  }catch(e){ /* sin conexión: se reintenta */ }
  flushing=false; saveQ(); refreshProg();
}
function toggleCheck(b,c,id){
  if(!CAN()) return;
  const key=PKEY(b,c), z=PROG.zones[key]||(PROG.zones[key]={}), d=!isDone(b,c,id), now=new Date().toISOString();
  if(DEMO){ z[id]=d?{done:true,by:'Demo',date:now.slice(0,10)}:{done:false}; saveLocal(); }
  else { QUEUE.push({external_id:[CFG.obraId||'',key,id,now].join('|'),obra:CFG.obraId||'',zona:key,check:id,done:d,ts:now}); saveQ(); applyQueue(); flushQ(); }
  PROG.updated=now; refreshProg();
}

/* ---------- geometría de la cámara ---------- */
const measure=()=>{const r=stage.getBoundingClientRect(); vw=r.width; vh=r.height;};
const fitCam=()=>{const pad=Math.max(8,Math.min(vw,vh)*0.02); const k=Math.min((vw-2*pad)/SW,(vh-2*pad)/SH); return {k,x:(vw-SW*k)/2,y:(vh-SH*k)/2};};
const bboxOf=P=>{let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const [x,y] of P){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);} return {x0,y0,x1,y1};};
const bboxCam=(b,f=0.8)=>{const w=b.x1-b.x0,h=b.y1-b.y0; const k=Math.min(vw*f/w,vh*f/h); return {k,x:vw/2-(b.x0+w/2)*k,y:vh/2-(b.y0+h/2)*k};};
const lerp=(a,b,t)=>a+(b-a)*t;
const toC=c=>({k:c.k,cx:(vw/2-c.x)/c.k,cy:(vh/2-c.y)/c.k});
const fromC=c=>({k:c.k,x:vw/2-c.cx*c.k,y:vh/2-c.cy*c.k});
function mix(a,b,e){ // zoom exponencial, el punto de destino se mantiene anclado
  const A=toC(a), Z=toC(b);
  const k=Math.exp(lerp(Math.log(A.k),Math.log(Z.k),e));
  const d=(1/Z.k-1/A.k); const u=Math.abs(d)<1e-9?e:(1/k-1/A.k)/d;
  return fromC({k,cx:lerp(A.cx,Z.cx,u),cy:lerp(A.cy,Z.cy,u)});
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sm=t=>{t=Math.min(1,Math.max(0,t)); return t*t*(3-2*t);};
function apply(L){
  L.el.style.transform=`translate(${L.cam.x}px,${L.cam.y}px) scale(${L.cam.k})`;
  L.el.style.setProperty('--inv',(1/L.cam.k).toFixed(5));
}

/* ---------- qué plano corresponde a cada vista ---------- */
function sheetOf(v){
  if(v.lvl===0) return {url:'img/general_1.webp'+IV,alt:CFG.alt0||`Plano general con ${DATA.buildings.length} ${LB.l1p.toLowerCase()}`};
  const t=B[v.b].tipo;
  if(v.lvl===1) return {url:(B[v.b].img||`img/edif_${t}.webp`)+IV,alt:`Plano: ${LB.l1.toLowerCase()} ${v.b}${KIND==='electrica'?'':', tipo '+t}`};
  const c=cubsOf(v.b).find(c=>c.id===v.c);
  return {url:detailUrl(t,c),alt:`Plano de detalle: ${LB.l2.toLowerCase()} ${v.c}`};
}
function zonesOf(v){
  const hasP=CL.length>0;
  if(v.lvl===0) return DATA.buildings.map(b=>{const tp=T[b.tipo], tt=tipoTxt(b.tipo);
    const base=(LB.unit&&tp.panels!=null)?`${tp.panels} ${LB.unit}`:`${tp.cubs.length} ${LB.l2p.toLowerCase()}`;
    return {id:b.id,col:b.col||b.tipo,poly:b.poly,lab:b.lab,text:b.id,
      title:`${LB.l1} ${b.id}`,sub:tt,aria:`${LB.l1} ${b.id}, ${join(tt,base)}`.replace(/ · /g,', '),n:base,
      pct:hasP?()=>agg(bZones(b.id)).pct:null,go:{lvl:1,b:b.id}};});
  if(v.lvl===1) return cubsOf(v.b).map(c=>({id:c.id,col:colOf(v.b),poly:c.poly,lab:c.lab,text:c.id,
    title:`${LB.l2} ${c.id}`,sub:LB.l2,aria:`${LB.l2} ${c.id}${cn(c)?', '+cn(c):''}`,n:cn(c),
    pct:hasP?()=>pctZ(v.b,c.id):null,go:{lvl:2,b:v.b,c:c.id}}));
  return [];
}

/* ---------- capa de un plano (imagen + zonas) ---------- */
async function mkLayer(v){
  const s=sheetOf(v);
  const el=document.createElement('div'); el.className='sheet lvl'+v.lvl; el.style.width=SW+'px'; el.style.height=SH+'px'; el.style.opacity=0;
  const img=new Image(); img.alt=s.alt; img.draggable=false; img.src=s.url;
  await Promise.race([img.decode().catch(()=>{}),new Promise(r=>{img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true});}),new Promise(r=>setTimeout(r,6000))]);
  el.appendChild(img);
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox',`0 0 ${SW} ${SH}`);
  const zones={}, data=zonesOf(v);
  for(const z of data){
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','zone'); g.setAttribute('tabindex','0'); g.setAttribute('role','link');
    g.setAttribute('aria-label',z.aria);
    g.style.setProperty('--zc',`var(--t${z.col})`); g.style.setProperty('--zt',`var(--on-t${z.col})`);
    const p=document.createElementNS(NS,'polygon'); p.setAttribute('points',z.poly.map(q=>q.join(',')).join(' ')); g.appendChild(p);
    const tag=document.createElementNS(NS,'g'); tag.setAttribute('class','tag'); tag.style.setProperty('--lx',z.lab[0]+'px'); tag.style.setProperty('--ly',z.lab[1]+'px');
    const w=z.text.length*8+16; const r=document.createElementNS(NS,'rect'); r.setAttribute('x',-w/2); r.setAttribute('y',-10); r.setAttribute('width',w); r.setAttribute('height',20); r.setAttribute('rx',4);
    const tx=document.createElementNS(NS,'text'); tx.textContent=z.text; tag.append(r,tx);
    if(z.pct){ // barra de avance bajo la etiqueta
      const bg=document.createElementNS(NS,'rect'); bg.setAttribute('class','pgbg'); bg.setAttribute('x',-w/2); bg.setAttribute('y',13); bg.setAttribute('width',w); bg.setAttribute('height',5); bg.setAttribute('rx',2.5);
      const f=document.createElementNS(NS,'rect'); f.setAttribute('class','pgf'); f.setAttribute('x',-w/2); f.setAttribute('y',13); f.setAttribute('width',w*z.pct()/100); f.setAttribute('height',5); f.setAttribute('rx',2.5);
      tag.append(bg,f); }
    g.appendChild(tag);
    const open=()=>{ if(!busy&&cur&&cur.el===el) go(z.go,'in',bboxOf(z.poly)); };
    g.addEventListener('click',open);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
    g.addEventListener('mouseenter',()=>hot(z.id,true)); g.addEventListener('mouseleave',()=>hot(z.id,false));
    g.addEventListener('focus',()=>hot(z.id,true)); g.addEventListener('blur',()=>hot(z.id,false));
    svg.appendChild(g); zones[z.id]=g;
  }
  el.appendChild(svg);
  return {el,zones,data,cam:fitCam(),view:v};
}
function hot(id,on){
  if(cur&&cur.zones[id]) cur.zones[id].classList.toggle('hot',on);
  const it=side.querySelector(`.item[data-id="${CSS.escape(id)}"]`); if(it) it.classList.toggle('hot',on);
}

/* ---------- transiciones ---------- */
function run(dur,fn){return new Promise(res=>{ if(dur<=0){fn(1);res();return;} const t0=performance.now();
  const tick=now=>{const t=Math.min(1,(now-t0)/dur); fn(t); t<1?requestAnimationFrame(tick):res();}; requestAnimationFrame(tick);});}
async function transition(nl,mode,bb){
  const old=cur; stage.insertBefore(nl.el,hint);
  if(!old){nl.el.style.opacity=1; apply(nl); cur=nl; return;}
  old.el.classList.add('inert'); nl.el.classList.add('inert');
  const fit=fitCam(); nl.cam=fit; const c0={...old.cam};
  const small=c=>mix(c,{k:c.k*0.86,x:vw/2-(vw/2-c.x)*0.86,y:vh/2-(vh/2-c.y)*0.86},1);
  if(mode==='in'){
    const target=bboxCam(bb); const start=small(fit); nl.cam=start; apply(nl);
    await run(reduce?0:820,t=>{const e=ease(t);
      old.cam=mix(c0,target,e); apply(old);
      nl.cam=mix(start,fit,e); apply(nl);
      nl.el.style.opacity=sm((t-.42)/.5); old.el.style.opacity=1-sm((t-.72)/.28);});
  }else if(mode==='out'){
    const from=bboxCam(bb); nl.cam=from; apply(nl);
    const oldEnd=small(c0);
    await run(reduce?0:820,t=>{const e=ease(t);
      nl.cam=mix(from,fit,e); apply(nl);
      old.cam=mix(c0,oldEnd,e); apply(old);
      nl.el.style.opacity=sm(t/.55); old.el.style.opacity=1-sm((t-.5)/.5);});
  }else{
    apply(nl);
    await run(reduce?0:300,t=>{nl.el.style.opacity=sm(t); old.el.style.opacity=1-sm((t-.3)/.7);});
  }
  nl.el.style.opacity=1; nl.el.classList.remove('inert'); apply(nl);
  old.el.remove(); cur=nl;
}
async function go(v,mode,bb){
  if(busy) return; busy=true;
  try{ const L=await mkLayer(v); await transition(L,mode,bb); view=v; loading.remove(); render(); updateBars(); preload(); }
  catch(err){ if(loading.isConnected){loading.textContent='No se pudo cargar el visor. Recarga la página o prueba con otro navegador.';} console.error(err); }
  finally{busy=false;}
}

/* ---------- barra, migas y lista lateral ---------- */
function bboxOfBuilding(id){return bboxOf(B[id].poly);}
function bboxOfCub(v){const c=cubsOf(v.b).find(c=>c.id===v.c); return bboxOf(c.poly);}
function updateBars(){ if(!cur||!CL.length) return;
  for(const z of cur.data){ const g=cur.zones[z.id]; if(!g||!z.pct) continue; const f=g.querySelector('.pgf'), bg=g.querySelector('.pgbg');
    if(f&&bg) f.setAttribute('width',(+bg.getAttribute('width'))*z.pct()/100); } }
function refreshProg(){ if(!view||busy) return; render(); updateBars(); }
const fmtDate=s=>{ if(!s) return ''; const d=new Date(s.length<=10?s+'T12:00:00':s); return isNaN(d)?'':d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); };
const fmtStamp=s=>{ const d=new Date(s); return isNaN(d)?'':d.toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
function up(){ if(!view||view.lvl===0) return; if(view.lvl===2) go({lvl:1,b:view.b},'out',bboxOfCub(view)); else go({lvl:0},'out',bboxOfBuilding(view.b)); }
function render(){
  const v=view, tipo=v.lvl?B[v.b].tipo:null, tt=v.lvl?tipoTxt(tipo):'';
  const bLabel=v.lvl?`${LB.l1} ${v.b}${tt?' · '+tt:''}`:'';
  backBtn.disabled=v.lvl===0;
  const items=[[LB.l0,v.lvl>0&&(()=>go({lvl:0},'out',bboxOfBuilding(v.b)))]];
  if(v.lvl>=1) items.push([bLabel,v.lvl>1&&(()=>go({lvl:1,b:v.b},'out',bboxOfCub(v)))]);
  if(v.lvl===2) items.push([`${LB.l2} ${v.c}`,false]);
  crumbs.replaceChildren(...items.map(([txt,fn])=>{const li=document.createElement('li');
    if(fn){const b=document.createElement('button'); b.textContent=txt; b.addEventListener('click',fn); li.appendChild(b);}
    else{const s=document.createElement('span'); s.textContent=txt; s.setAttribute('aria-current','page'); li.appendChild(s);} return li;}));
  hint.textContent=v.lvl===0?`Pincha ${LB.a1} para acercarte a su plano`:v.lvl===1?`Pincha ${LB.a2} para ver su plano de detalle`:'Rueda para ampliar y arrastra para mover el plano';

  const head=document.createElement('header'); const ey=document.createElement('div'); ey.className='eyebrow';
  const h=document.createElement('h2'); const p=document.createElement('p');
  if(v.lvl===0){ey.textContent='Nivel 1 de 3';h.textContent=LB.l0;
    p.textContent=`${DATA.buildings.length} ${LB.l1p.toLowerCase()}${KIND==='electrica'?'':' · '+Object.keys(T).length+' tipos'}. ${LB.intro0}`;}
  else if(v.lvl===1){ey.textContent='Nivel 2 de 3';h.textContent=`${LB.l1} ${v.b}`;const tp=T[tipo];
    p.textContent=join(tt,`${tp.cubs.length} ${LB.l2p.toLowerCase()}`,(LB.unit&&tp.panels!=null)?`${tp.panels} ${LB.unit}`:'');}
  else{ey.textContent='Nivel 3 de 3';h.textContent=`${LB.l2} ${v.c}`;const c=cubsOf(v.b).find(c=>c.id===v.c);
    p.textContent=join(`${LB.l1} ${v.b}`,tt,cn(c));}
  head.append(ey,h,p);
  const ul=document.createElement('ul'); ul.className='list';
  const rows=v.lvl===2?cubsOf(v.b).map(c=>({id:c.id,col:colOf(v.b),title:`${LB.l2} ${c.id}`,sub:LB.l2,n:cn(c),pct:CL.length?()=>pctZ(v.b,c.id):null,go:{lvl:2,b:v.b,c:c.id}})):cur.data;
  for(const r of rows){
    const li=document.createElement('li'); const b=document.createElement('button'); b.className='item'; b.dataset.id=r.id;
    b.style.setProperty('--zc',`var(--t${r.col})`);
    if(v.lvl===2&&r.id===v.c) b.setAttribute('aria-current','true');
    b.innerHTML='<span class="sw"></span><span class="id"></span><span class="meta"></span><span class="n"></span>';
    b.children[1].textContent=r.id; b.children[2].textContent=r.sub; b.children[3].textContent=join(r.n,r.pct?r.pct()+'%':'');
    b.addEventListener('mouseenter',()=>hot(r.id,true)); b.addEventListener('mouseleave',()=>hot(r.id,false));
    b.addEventListener('click',()=>{ if(busy) return; if(v.lvl===2){ if(r.id!==v.c) go(r.go,'swap'); } else go(r.go,'in',bboxOf(cur.data.find(z=>z.id===r.id).poly)); });
    li.appendChild(b); ul.appendChild(li);
  }
  side.replaceChildren(head,ul);
  buildNav(v,tipo,rows);
  renderChecks();
  if(v.lvl===2){
    const cubs=cubsOf(v.b), i=cubs.findIndex(c=>c.id===v.c);
    const pg=document.createElement('div'); pg.className='pager';
    const prev=document.createElement('button'); prev.textContent=i>0?`‹ ${cubs[i-1].id}`:'‹'; prev.disabled=i<=0; prev.setAttribute('aria-label',`${LB.l2} anterior`);
    const next=document.createElement('button'); next.textContent=i<cubs.length-1?`${cubs[i+1].id} ›`:'›'; next.disabled=i>=cubs.length-1; next.setAttribute('aria-label',`${LB.l2} siguiente`);
    prev.addEventListener('click',()=>step(-1)); next.addEventListener('click',()=>step(1)); pg.append(prev,next); side.appendChild(pg);
    const cur_=ul.querySelector('[aria-current="true"]'); if(cur_) cur_.scrollIntoView({block:'nearest'});
  }
}
/* ---------- panel de checks (izquierda) ---------- */
const checks=document.getElementById('checks');
const LAND=matchMedia('(orientation:landscape) and (max-height:520px)');   // móvil en horizontal
const cpill=document.getElementById('cpill'), cpc=document.getElementById('cpc');
const cclose=document.createElement('button'); cclose.type='button'; cclose.className='cclose'; cclose.setAttribute('aria-label','Ocultar checks'); cclose.title='Ocultar checks';
cclose.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>';
['pointerdown','pointerup','pointercancel','dblclick','wheel','click'].forEach(t=>{ checks.addEventListener(t,e=>e.stopPropagation(),{passive:true}); cpill.addEventListener(t,e=>e.stopPropagation(),{passive:true}); });
const ICON_OK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CH='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
function renderChecks(){
  if(!CL.length||!view){ checks.hidden=true; cpill.hidden=true; return; }
  checks.hidden=false; cpill.hidden=false;
  const v=view, open=checks.classList.contains('open');
  const head=document.createElement('button'); head.type='button'; head.className='chead'; head.setAttribute('aria-expanded',open);
  const ey=document.createElement('div'); ey.className='eyebrow';
  const row=document.createElement('div'); row.className='row'; const h=document.createElement('h2'); const cnt=document.createElement('span'); cnt.className='cnt';
  const p=document.createElement('p'); const bar=document.createElement('div'); bar.className='cbar'; const fill=document.createElement('i'); bar.appendChild(fill);
  const body=document.createElement('ul'); body.className='cl';
  let pct;
  if(v.lvl===2){
    const done=zdone(v.b,v.c); pct=pctZ(v.b,v.c);
    ey.textContent='Checklist del día'; h.textContent=`${LB.l2} ${v.c}`; cnt.textContent=`${done}/${CL.length}`; p.textContent=`${LB.l1} ${v.b}`;
    for(const k of CL){
      const s=zst(v.b,v.c)[k.id]||{}, d=!!s.done;
      const li=document.createElement('li'); const edit=CAN(); const el=document.createElement(edit?'button':'div'); el.className='chk';
      el.setAttribute('role','checkbox'); el.setAttribute('aria-checked',d); if(edit){ el.type='button'; el.addEventListener('click',()=>toggleCheck(v.b,v.c,k.id)); } else el.setAttribute('aria-readonly','true');
      const box=document.createElement('span'); box.className='box'; box.innerHTML=ICON_OK;
      const tx=document.createElement('span'); const l=document.createElement('span'); l.className='lbl'; l.textContent=k.label; tx.appendChild(l);
      const meta=isPend(v.b,v.c,k.id)?'Sin enviar':(d?join(s.by,fmtDate(s.date)):''); if(meta){ const w=document.createElement('span'); w.className='who'; w.textContent=meta; tx.appendChild(w); }
      el.append(box,tx); li.appendChild(el); body.appendChild(li);
    }
  } else {
    const list=v.lvl===0?allZones():bZones(v.b), a=agg(list); pct=a.pct;
    ey.textContent='Avance de obra'; h.textContent=v.lvl===0?'Total de la obra':`${LB.l1} ${v.b}`; cnt.textContent=a.pct+'%';
    p.textContent=`${a.done} de ${a.max} checks · ${a.n} ${LB.l2p.toLowerCase()}`;
    for(const x of a.per){
      const li=document.createElement('li'); li.className='ag';
      const r=document.createElement('div'); r.className='row'; const n=document.createElement('span'); n.textContent=x.k.label; const c=document.createElement('b'); c.textContent=`${x.d}/${a.n}`; r.append(n,c);
      const b=document.createElement('div'); b.className='cbar'; const f=document.createElement('i'); f.style.width=(a.n?100*x.d/a.n:0)+'%'; b.appendChild(f);
      li.append(r,b); body.appendChild(li);
    }
  }
  fill.style.width=pct+'%'; cpc.textContent=cnt.textContent;
  row.append(h,cnt); head.append(ey,row,p,bar); row.insertAdjacentHTML('beforeend',ICON_CH);
  head.addEventListener('click',()=>{ if(!matchMedia('(max-width:820px)').matches||LAND.matches||checks.classList.contains('ovl')) return; const o=checks.classList.toggle('open'); head.setAttribute('aria-expanded',o); });
  const note=document.createElement('div'); note.className='cnote';
  const prov=CFG.checklistProvisional?'Checklist provisional. ':'';
  const wmsg=!WRITE?'':AUTHFAIL?'La sesión ha caducado: vuelve a abrir el plano desde la App IEC para guardar.'
    :!AUTH()?'Solo lectura: abre el plano desde la App IEC para marcar los checks.'
    :QUEUE.length?`${QUEUE.length} ${QUEUE.length===1?'cambio sin enviar':'cambios sin enviar'}; se enviarán al recuperar la conexión.`:'';
  if(prov||PROG.error||wmsg) note.classList.add('warn');
  checks.classList.toggle('edit',CAN());
  note.textContent=prov+(wmsg||(PROG.error?'No se pudo leer el avance; se reintentará en un minuto.'
    :DEMO?'Modo demostración: los checks se guardan solo en este navegador.'
    :WRITE?(PROG.updated?`Última actualización: ${fmtStamp(PROG.updated)}. Toca un check para marcarlo; se guarda en Airtable.`:'Toca un check para marcarlo; se guarda en Airtable.')
    :PROG.updated?`Última actualización: ${fmtStamp(PROG.updated)}. Los checks se rellenan desde la App IEC.`:'Todavía no hay registros. Los checks se rellenan desde la App IEC.'));
  checks.replaceChildren(head,body,note,cclose);
}

const fsnav=document.getElementById('fsnav'), fsmenu=document.getElementById('fsmenu'), fstog=document.getElementById('fstog'), fstxt=document.getElementById('fstxt'), fsback=document.getElementById('fsback');
['pointerdown','pointerup','dblclick','wheel','click'].forEach(t=>fsnav.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
fstog.addEventListener('click',()=>{ const o=fsnav.classList.toggle('open'); fstog.setAttribute('aria-expanded',o); });
fsback.addEventListener('click',()=>{ fsnav.classList.remove('open'); fstog.setAttribute('aria-expanded',false); up(); });
function buildNav(v,tipo,rows){
  fsback.disabled=v.lvl===0;
  const tt=tipo!=null?tipoTxt(tipo):'';
  fstxt.textContent=v.lvl===0?LB.l0:v.lvl===1?join(`${LB.l1} ${v.b}`,tt):`${LB.l1} ${v.b} · ${LB.l2} ${v.c}`;
  const close=()=>{ fsnav.classList.remove('open'); fstog.setAttribute('aria-expanded',false); };
  const row=(label,meta,color,fn,cur)=>{ const b=document.createElement('button'); const i=document.createElement('i'); if(color) i.style.setProperty('--zc',color);
    const l=document.createElement('span'); l.textContent=label; const m=document.createElement('small'); m.textContent=meta||'';
    b.append(i,l,m); if(cur) b.setAttribute('aria-current','true'); b.addEventListener('click',()=>{ if(busy) return; fn(); }); return b; };
  const out=[];
  if(v.lvl>0){ const h=document.createElement('h3'); h.textContent='Subir a'; out.push(h);
    out.push(row(LB.l0,'',null,()=>{close(); go({lvl:0},'out',bboxOfBuilding(v.b));}));
    if(v.lvl===2) out.push(row(join(`${LB.l1} ${v.b}`,tt),'',`var(--t${colOf(v.b)})`,()=>{close(); go({lvl:1,b:v.b},'out',bboxOfCub(v));})); }
  const h2=document.createElement('h3'); h2.textContent=v.lvl===0?LB.l1p:LB.l2p; out.push(h2);
  for(const r of rows){ const col=`var(--t${r.col})`;
    out.push(row(v.lvl===0?`${LB.l1} ${r.id}`:`${LB.l2} ${r.id}`, join(r.n,r.pct?r.pct()+'%':''), col, ()=>{
      if(v.lvl===2){ if(r.id!==v.c) go(r.go,'swap'); }
      else { close(); go(r.go,'in',bboxOf(cur.data.find(z=>z.id===r.id).poly)); } }, v.lvl===2&&r.id===v.c)); }
  fsmenu.replaceChildren(...out);
}
function step(d){ if(!view||view.lvl!==2||busy) return; const cubs=cubsOf(view.b); const i=cubs.findIndex(c=>c.id===view.c)+d; if(i>=0&&i<cubs.length) go({lvl:2,b:view.b,c:cubs[i].id},'swap'); }
backBtn.addEventListener('click',up);

/* ---------- zoom y desplazamiento ---------- */
const ptrs=new Map(); let pan=null, pinch=null, moved=0;
const limits=()=>{const f=fitCam().k; return [f*0.8,f*10];};
function clampCam(c){const [lo,hi]=limits(); c.k=Math.min(hi,Math.max(lo,c.k));
  c.x=Math.min(vw*0.85,Math.max(vw*0.15-SW*c.k,c.x)); c.y=Math.min(vh*0.85,Math.max(vh*0.15-SH*c.k,c.y)); return c;}
function zoomAt(px,py,f){ if(!cur||busy) return; const c=cur.cam; const [lo,hi]=limits(); const k=Math.min(hi,Math.max(lo,c.k*f)); const r=k/c.k;
  cur.cam=clampCam({k,x:px-(px-c.x)*r,y:py-(py-c.y)*r}); apply(cur); }
async function animateTo(target){ if(!cur||busy) return; const L=cur, c0={...L.cam}; await run(reduce?0:260,t=>{L.cam=mix(c0,target,ease(t)); apply(L);}); }
stage.addEventListener('wheel',e=>{ if(!cur||busy) return; e.preventDefault(); const r=stage.getBoundingClientRect();
  const dy=e.deltaMode===1?e.deltaY*16:e.deltaY; zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-dy*(e.ctrlKey?0.01:0.0016))); },{passive:false});
stage.addEventListener('pointerdown',e=>{ if(!cur||busy||e.button>0) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){pan={x:e.clientX,y:e.clientY,cx:cur.cam.x,cy:cur.cam.y}; moved=0;}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:cur.cam.k}; pan=null; stage.setPointerCapture(e.pointerId); moved=99;}});
stage.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)||!cur||busy) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=stage.getBoundingClientRect();
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
    const c=cur.cam; const [lo,hi]=limits(); const k=Math.min(hi,Math.max(lo,pinch.k*d/pinch.d)); const q=k/c.k; cur.cam=clampCam({k,x:mx-(mx-c.x)*q,y:my-(my-c.y)*q}); apply(cur); return;}
  if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y; moved=Math.max(moved,Math.hypot(dx,dy));
    if(moved>5){ if(!stage.hasPointerCapture(e.pointerId)) stage.setPointerCapture(e.pointerId); stage.classList.add('drag');
      cur.cam=clampCam({k:cur.cam.k,x:pan.cx+dx,y:pan.cy+dy}); apply(cur);} }});
let lastTap=0,lastX=0,lastY=0;
const endPtr=e=>{ if(e.type==='pointerup'&&e.pointerType==='touch'&&moved<6&&ptrs.size===1&&cur&&!busy&&!(e.target.closest&&(e.target.closest('.zone')||e.target.closest('.ctl')))){const n=Date.now(); if(n-lastTap<320&&Math.hypot(e.clientX-lastX,e.clientY-lastY)<30){const r=stage.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,2.2); lastTap=0;} else {lastTap=n;lastX=e.clientX;lastY=e.clientY;}}
  ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(ptrs.size===0){pan=null; stage.classList.remove('drag');}};
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('dblclick',e=>{ if(e.target.closest&&e.target.closest('.zone')||e.target.closest('.ctl')) return; const r=stage.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,2); });
document.getElementById('zin').addEventListener('click',()=>zoomAt(vw/2,vh/2,1.5));
document.getElementById('zout').addEventListener('click',()=>zoomAt(vw/2,vh/2,1/1.5));
document.getElementById('zfit').addEventListener('click',()=>animateTo(fitCam()));
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  if(e.key==='Escape'||e.key==='Backspace'){ if(view&&view.lvl>0){e.preventDefault();up();} }
  else if(e.key==='ArrowRight') step(1); else if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='+'||e.key==='=') zoomAt(vw/2,vh/2,1.4); else if(e.key==='-') zoomAt(vw/2,vh/2,1/1.4); else if(e.key==='0') animateTo(fitCam());
});
(function(){
  const app=document.querySelector('.app'), ptog=document.getElementById('ptog'), ptxt=document.getElementById('ptxt'), zfs=document.getElementById('zfs');
  const ctog=document.getElementById('ctog'), ctxt=document.getElementById('ctxt');
  const layout=()=>{ const c=CL.length&&!app.classList.contains('nochecks')&&checks.parentNode===app, s=!app.classList.contains('nopanel')&&!LAND.matches;
    app.style.gridTemplateColumns=[c?(LAND.matches?'250px':'260px'):'','minmax(0,1fr)',s?'300px':''].filter(Boolean).join(' '); };
  if(LAND.addEventListener) LAND.addEventListener('change',layout); else if(LAND.addListener) LAND.addListener(layout);
  if(CL.length) ctog.hidden=false; else app.classList.add('nochecks');
  layout();
  ptog.addEventListener('click',()=>{ const h=app.classList.toggle('nopanel'); ptxt.textContent=h?'Mostrar panel':'Ocultar panel'; ptog.title=ptxt.textContent; ptog.setAttribute('aria-pressed',h); layout(); });
  ctog.addEventListener('click',()=>{ const h=app.classList.toggle('nochecks'); ctxt.textContent=h?'Mostrar checks':'Ocultar checks'; ctog.title=ctxt.textContent; ctog.setAttribute('aria-pressed',h); layout(); });
  const isFs=()=>document.fullscreenElement===stage||document.webkitFullscreenElement===stage||stage.classList.contains('pfs');
  /* en pantalla completa solo se ve el plano: los checks pasan a un cajón dentro del plano (izquierda) */
  const setDrawer=o=>{ checks.classList.toggle('show',o); stage.classList.toggle('cdrawer',o); };
  const syncFs=()=>{
    if(isFs()&&CL.length){
      if(checks.parentNode!==stage) stage.appendChild(checks);
      checks.classList.add('ovl');
      setDrawer(!app.classList.contains('nochecks')&&!(matchMedia('(max-width:820px)').matches&&!LAND.matches));
    } else {
      checks.classList.remove('ovl','show'); stage.classList.remove('cdrawer');
      if(checks.parentNode!==app) app.insertBefore(checks,stage);
      layout();
    }
  };
  const setPfs=on=>{ stage.classList.toggle('pfs',on); syncFs(); };
  cpill.addEventListener('click',()=>setDrawer(true));
  cclose.addEventListener('click',()=>setDrawer(false));
  document.addEventListener('fullscreenchange',syncFs); document.addEventListener('webkitfullscreenchange',syncFs);
  const toggleFs=()=>{
    if(isFs()){ if(stage.classList.contains('pfs')) setPfs(false); else (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    const rq=stage.requestFullscreen||stage.webkitRequestFullscreen;
    if(rq){ try{ const p=rq.call(stage); if(p&&p.catch) p.catch(()=>setPfs(true)); }catch(e){ setPfs(true); } }
    else setPfs(true);
  };
  zfs.addEventListener('click',toggleFs);
  addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F'){ if(!e.ctrlKey&&!e.metaKey&&!e.altKey) toggleFs(); } else if(e.key==='Escape'&&stage.classList.contains('pfs')) setPfs(false); });
})();
new ResizeObserver(()=>{ const f0=cur?fitCam().k:0; const old=vw; measure(); if(cur&&!busy){ const wasFit=old&&Math.abs(cur.cam.k-f0)<1e-6; if(wasFit||!old) {cur.cam=fitCam(); apply(cur);} } }).observe(stage);

/* ---------- arranque ---------- */
function preload(){ const seen=new Set(); const q=[]; const t=view.lvl?B[view.b].tipo:null;
  DATA.buildings.forEach(b=>q.push((b.img||`img/edif_${b.tipo}.webp`)+IV)); if(t) T[t].cubs.forEach(c=>q.push(detailUrl(t,c)));
  const go_=()=>{const u=q.shift(); if(!u) return; if(!seen.has(u)){seen.add(u); const i=new Image(); i.onload=i.onerror=()=>setTimeout(go_,60); i.src=u;} else go_();};
  if(window.requestIdleCallback) requestIdleCallback(go_,{timeout:1500}); else setTimeout(go_,400); }
function fromHash(){ const h=decodeURIComponent(location.hash.slice(1)); const m=h.match(/^e([^_]+)(?:_c(.+))?$/); if(m&&B[m[1]]){
  if(m[2]&&cubsOf(m[1]).some(c=>c.id===m[2])) return {lvl:2,b:m[1],c:m[2]}; return {lvl:1,b:m[1]}; } return {lvl:0}; }
if(CFG.title) document.title=CFG.title;
if(CFG.site){ const s=document.querySelector('.site'); const b=document.createElement('b'); b.textContent=CFG.site.name||''; s.replaceChildren(b,document.createTextNode(CFG.site.sub||'')); }
measure();
(async()=>{
  const p=loadProgress();                       // el avance no debe retrasar el arranque más de 2,5 s
  await Promise.race([p,new Promise(r=>setTimeout(r,2500))]);
  await go(fromHash(),'swap');
  p.then(()=>{ refreshProg(); });
  if(WRITE){ flushQ(); setInterval(flushQ,20000); addEventListener('online',flushQ); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) flushQ(); }); }
  if(CL.length&&CFG.progressUrl){
    const poll=async()=>{ await loadProgress(); refreshProg(); };
    setInterval(poll,60000);
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });
  }
})();
})();
</script>
